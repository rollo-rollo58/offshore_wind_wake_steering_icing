apiVersion: apps/v1
kind: Deployment
metadata:
  name: aerowake-api
  labels:
    app: aerowake-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aerowake-api
  template:
    metadata:
      labels:
        app: aerowake-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: example.invalid/aerowake-api:replace-with-reviewed-image
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Service
metadata:
  name: aerowake-api
spec:
  selector:
    app: aerowake-api
  ports:
    - name: http
      port: 8000
      targetPort: 8000
